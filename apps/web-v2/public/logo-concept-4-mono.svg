<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 4: Monogram "S" — 用两段弧线拼成 S 形，像闪电也像环 -->
  <rect width="1024" height="1024" rx="200" fill="#0B0B1A"/>

  <!-- S-shape from two arcs — 上半弧向右弯，下半弧向左弯 -->
  <path d="M 380 300 Q 620 280 580 460 Q 550 600 380 540 Q 620 620 640 720"
        stroke="url(#s-grad)" stroke-width="48" stroke-linecap="round" fill="none"/>

  <!-- Small spark dot at the center crossing -->
  <circle cx="490" cy="520" r="20" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="s-grad" x1="380" y1="300" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>
