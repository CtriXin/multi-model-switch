<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SparkRing V4.5 Master Branding - The Pulse Monolith -->
  
  <!-- 1. Background (Absolute Void) -->
  <rect width="1024" height="1024" rx="240" fill="#020205"/>

  <!-- 2. Precision Grid (Subtle Detail) -->
  <g opacity="0.05" stroke="white" stroke-width="1">
    <line x1="512" y1="0" x2="512" y2="1024" />
    <line x1="0" y1="512" x2="1024" y2="512" />
    <circle cx="512" cy="512" r="256" fill="none" />
  </g>

  <!-- 3. The Heavy Shells (The Ring) -->
  <g stroke="#6366F1" stroke-width="48" stroke-linecap="butt">
    <!-- Left Heavy Shell -->
    <path d="M400 200 C250 250 150 400 150 512 C150 624 250 774 400 824" opacity="0.9" />
    <!-- Right Heavy Shell -->
    <path d="M624 200 C774 250 874 400 874 512 C874 624 774 774 624 824" opacity="0.9" />
  </g>

  <!-- 4. The Pulse Core (The Spark) -->
  <!-- A vertical energy blade representing pure data flow -->
  <path d="M512 280 L540 512 L512 744 L484 512 Z" fill="white">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" />
  </path>
  
  <!-- 5. Internal Precision Accents -->
  <g stroke="white" stroke-width="4" opacity="0.4">
    <!-- Top & Bottom Markers -->
    <line x1="512" y1="120" x2="512" y2="180" />
    <line x1="512" y1="844" x2="512" y2="904" />
    <!-- Center Jewel -->
    <circle cx="512" cy="512" r="12" fill="white" />
  </g>

  <!-- 6. Light Leak (Atmospheric) -->
  <circle cx="512" cy="512" r="120" fill="#6366F1" opacity="0.1" />
</svg>
