<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SparkRing V4.4 Concept: The Aperture (Focus & Observation) -->
  <defs>
    <linearGradient id="blade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1024" height="1024" rx="240" fill="#020205"/>

  <!-- 2. The 6 Aperture Blades (Mechanical Focus) -->
  <g transform="translate(512, 512)">
    <!-- Blade 1 -->
    <path d="M0 -400 L150 -380 L50 -100 Z" fill="url(#blade-grad)" opacity="0.9" transform="rotate(0)"/>
    <!-- Blade 2 -->
    <path d="M0 -400 L150 -380 L50 -100 Z" fill="url(#blade-grad)" opacity="0.8" transform="rotate(60)"/>
    <!-- Blade 3 -->
    <path d="M0 -400 L150 -380 L50 -100 Z" fill="url(#blade-grad)" opacity="0.7" transform="rotate(120)"/>
    <!-- Blade 4 -->
    <path d="M0 -400 L150 -380 L50 -100 Z" fill="url(#blade-grad)" opacity="0.6" transform="rotate(180)"/>
    <!-- Blade 5 -->
    <path d="M0 -400 L150 -380 L50 -100 Z" fill="url(#blade-grad)" opacity="0.5" transform="rotate(240)"/>
    <!-- Blade 6 -->
    <path d="M0 -400 L150 -380 L50 -100 Z" fill="url(#blade-grad)" opacity="0.4" transform="rotate(300)"/>
  </g>

  <!-- 3. The Central "Iris" (Pure Intelligence) -->
  <circle cx="512" cy="512" r="120" fill="#020205" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- 4. The Spark Point (The moment of focus) -->
  <circle cx="512" cy="512" r="40" fill="white" filter="url(#inner-glow)"/>
  
  <!-- 5. Tactical Markings (Industrial Detail) -->
  <g stroke="white" stroke-opacity="0.3" stroke-width="2">
    <line x1="512" y1="80" x2="512" y2="120" />
    <line x1="512" y1="904" x2="512" y2="944" />
    <line x1="80" y1="512" x2="120" y2="512" />
    <line x1="904" y1="512" x2="944" y2="512" />
  </g>

  <!-- 6. Outer Glass Ring -->
  <circle cx="512" cy="512" r="480" stroke="white" stroke-opacity="0.05" stroke-width="4"/>
</svg>
