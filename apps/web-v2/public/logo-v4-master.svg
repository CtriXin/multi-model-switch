<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SparkRing V4.3 Official Master Branding - Cinematic Precision -->
  <defs>
    <linearGradient id="glow-grad" x1="512" y1="120" x2="512" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8" />
      <stop offset="1" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- 1. Deep Void Background -->
  <rect width="1024" height="1024" rx="240" fill="#020205"/>

  <!-- 2. Precision Detail Orbit (Subtle) -->
  <circle cx="512" cy="512" r="320" stroke="white" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 12"/>

  <!-- 3. Tapered Trinity Rings (The Energy Flow) -->
  <g stroke="url(#glow-grad)" stroke-width="20" stroke-linecap="round">
    <!-- Top Energy Arc -->
    <path d="M512 140 C620 140 740 190 820 280" opacity="0.9" />
    <!-- Bottom Right Energy Arc -->
    <path d="M880 480 C900 580 840 740 700 840" opacity="0.7" />
    <!-- Bottom Left Energy Arc -->
    <path d="M320 840 C180 740 124 580 144 480 C160 380 240 240 360 180" opacity="0.5" />
  </g>

  <!-- 4. Compound Spark Core -->
  <g transform="translate(512, 512)">
    <!-- Inner Diamond Base -->
    <path d="M0 -120 L60 0 L0 120 L-60 0 Z" fill="white" opacity="0.2" />
    <!-- Sharp Precision Spikes -->
    <path d="M0 -220 L15 -40 L220 0 L15 40 L0 220 L-15 40 L-220 0 L-15 -40 Z" fill="white" />
    <!-- Center Jewel -->
    <circle r="30" fill="#6366F1" stroke="white" stroke-width="4" />
  </g>

  <!-- 5. Crosshair Guides -->
  <g stroke="white" stroke-width="1" stroke-opacity="0.2">
    <line x1="512" y1="400" x2="512" y2="624" />
    <line x1="400" y1="512" x2="624" y2="512" />
  </g>

  <!-- 6. Outer Protective Glass Edge -->
  <circle cx="512" cy="512" r="490" stroke="white" stroke-opacity="0.03" stroke-width="2"/>
</svg>
