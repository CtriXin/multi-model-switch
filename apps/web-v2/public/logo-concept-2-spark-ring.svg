<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 2: Spark Ring — 一个环，有一个缺口和光溢出 -->
  <rect width="1024" height="1024" rx="200" fill="#0B0B1A"/>

  <!-- The Ring -->
  <circle cx="512" cy="512" r="260" stroke="#4F46E5" stroke-width="36" fill="none"
          stroke-linecap="round" stroke-dasharray="1360 276" stroke-dashoffset="69"/>

  <!-- Spark burst from the gap — 从缺口处溢出的光 -->
  <g transform="translate(772, 420)">
    <line x1="0" y1="-50" x2="0" y2="-110" stroke="#A5B4FC" stroke-width="14" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="75" y2="-75" stroke="#818CF8" stroke-width="12" stroke-linecap="round"/>
    <line x1="-35" y1="-35" x2="-75" y2="-75" stroke="#C7D2FE" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="10" x2="100" y2="20" stroke="#6366F1" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Gap glow -->
  <circle cx="772" cy="420" r="28" fill="#A5B4FC" opacity="0.3"/>
  <circle cx="772" cy="420" r="14" fill="#FFFFFF"/>
</svg>
