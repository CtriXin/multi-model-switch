<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 3: Layered Rings — 同心双环，外环旋转偏移，内环实心，传达"多层" -->
  <rect width="1024" height="1024" rx="200" fill="#0B0B1A"/>

  <!-- Outer ring: 虚线，代表 provider 层 -->
  <circle cx="512" cy="512" r="320" stroke="#4338CA" stroke-width="28" fill="none"
          stroke-dasharray="50 30" stroke-linecap="round" opacity="0.6"/>

  <!-- Inner ring: 实线，代表 model 层 -->
  <circle cx="512" cy="512" r="220" stroke="#6366F1" stroke-width="32" fill="none"
          stroke-linecap="round"/>

  <!-- Center spark — 核心亮点 -->
  <circle cx="512" cy="512" r="100" fill="#6366F1" opacity="0.15"/>
  <circle cx="512" cy="512" r="48" fill="#A5B4FC"/>
  <circle cx="512" cy="512" r="24" fill="#FFFFFF"/>
</svg>
