<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="MMS launcher tree">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101820"/><stop offset=".52" stop-color="#142b2e"/><stop offset="1" stop-color="#213719"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#9ee7d5" stop-opacity=".36"/><stop offset="1" stop-color="#9ee7d5" stop-opacity="0"/></radialGradient>
  <linearGradient id="rootG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183d3a"/><stop offset="1" stop-color="#1f573d"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#203b5f"/><stop offset="1" stop-color="#264267"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#553a21"/><stop offset="1" stop-color="#674628"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#234f45"/><stop offset="1" stop-color="#24604c"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f315b"/><stop offset="1" stop-color="#63376e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
  <style>
    .title{font:700 25px ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill:#f7fff9; letter-spacing:.2px}
    .body{font:500 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill:#d8eee7; opacity:.92}
    .caption{font:600 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill:#bdeee2}
    .line{fill:none; stroke:#91e8d0; stroke-width:4; stroke-linecap:round; opacity:.55}
    .node{filter:url(#shadow)}
  </style>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<rect width="1280" height="720" fill="url(#glow)"/>
<path d="M60 120 C230 30 410 34 570 86 S990 170 1220 70" stroke="#f6d365" stroke-width="2" opacity=".18" fill="none"/>
<path d="M80 620 C300 560 438 640 650 590 S1010 510 1200 610" stroke="#9ee7d5" stroke-width="2" opacity=".16" fill="none"/>
<path class="line" d="M640.0 226 C640.0 275 195.0 265 195.0 316"/>
<path class="line" d="M640.0 226 C640.0 275 490.0 265 490.0 316"/>
<path class="line" d="M640.0 226 C640.0 275 785.0 265 785.0 316"/>
<path class="line" d="M640.0 226 C640.0 275 1080.0 265 1080.0 316"/>
<g class="node" transform="translate(430,66)">
<rect width="420" height="150" rx="18" fill="url(#rootG)" stroke="#ffffff" stroke-opacity=".28"/>
<text x="24" y="34" class="title">MMS</text>
<text x="24" y="66" class="body">本地 AI Coding Launcher</text>
<text x="24" y="88" class="body">一个入口，多个 CLI / provider / session</text>
</g>
<g class="node" transform="translate(70,330)">
<rect width="250" height="210" rx="18" fill="url(#g1)" stroke="#ffffff" stroke-opacity=".28"/>
<text x="24" y="34" class="title">入口层</text>
<text x="24" y="66" class="body">TUI 选模型</text>
<text x="24" y="88" class="body">mms claude / codex</text>
<text x="24" y="110" class="body">export / presets</text>
</g>
<g class="node" transform="translate(365,330)">
<rect width="250" height="210" rx="18" fill="url(#g2)" stroke="#ffffff" stroke-opacity=".28"/>
<text x="24" y="34" class="title">决策层</text>
<text x="24" y="66" class="body">provider profiles</text>
<text x="24" y="88" class="body">role + priority</text>
<text x="24" y="110" class="body">doctor / test / trace</text>
</g>
<g class="node" transform="translate(660,330)">
<rect width="250" height="210" rx="18" fill="url(#g3)" stroke="#ffffff" stroke-opacity=".28"/>
<text x="24" y="34" class="title">运行时隔离</text>
<text x="24" y="66" class="body">Claude projects resume</text>
<text x="24" y="88" class="body">Codex seed + write-back</text>
<text x="24" y="110" class="body">local bridge / gateway</text>
</g>
<g class="node" transform="translate(955,330)">
<rect width="250" height="210" rx="18" fill="url(#g4)" stroke="#ffffff" stroke-opacity=".28"/>
<text x="24" y="34" class="title">Session 能力包</text>
<text x="24" y="66" class="body">token-saver / TOON</text>
<text x="24" y="88" class="body">web-access / weber</text>
<text x="24" y="110" class="body">Caveman / OMC / ECC</text>
<text x="24" y="132" class="body">Pilot</text>
</g>
<text x="640" y="655" text-anchor="middle" class="caption">Launcher-first: 先决策，再隔离启动；能力包按 session 注入，不当作全局 fallback。</text>
</svg>