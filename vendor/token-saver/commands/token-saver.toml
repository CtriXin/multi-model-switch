description = "Enable or inspect Token Saver behavior"
prompt = "Use Token Saver rules for this session. For commands that may print long output, run `token-saver run --title \"short title\" -- <command>` so short output prints normally and long output becomes ref + snippet + exit code. Use `token-saver toon <json-file>` for agent-facing structured JSON when shorter. Do not transform command-required JSON, source files, code patches, raw secrets, tokens, cookies, auth headers, or exact API inputs. If args are provided, treat them as the specific token-saving task or mode to apply."
