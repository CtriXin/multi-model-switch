# MMS 配置文件
# 复制到 ~/.config/ccs/config.toml 后修改

[provider]
default = "default"

[[providers]]
id = "default"
name = "Default Gateway"
protocols = ["anthropic_messages", "openai_chat_completions"]
supported_clis = ["claude", "codex", "qwen", "kimi"]
enabled = true
# 对“慢但实际可用”的 Claude-compatible gateway，可显式跳过首启探测：
# skip_gateway_health_check = true
# skip_anthropic_probe = true

[user]
role = "全部模型"  # 可选: 全部模型 / 推荐模型

[recommend]
models = ["claude-sonnet-4-6", "qwen3-coder-plus", "gpt-4o-mini"]

[presets.coding]
cli = "claude"
provider = "default"
opus = "claude-opus-4-6"
sonnet = "claude-sonnet-4-6"
haiku = "claude-haiku-4-5-20251001"
subagent = "claude-sonnet-4-6"

[presets.cheap]
cli = "qwen"
provider = "default"
model = "qwen3-coder-plus"

[presets.codex-gpt]
cli = "codex"
provider = "default"
model = "gpt-5.4"
