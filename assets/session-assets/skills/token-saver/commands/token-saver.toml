description = "Enable or inspect Token Saver behavior"
prompt = "Use Token Saver rules for this session. Do not ask the user to remember or execute low-level commands. For commands that may print long output, internally run `token-saver run --title \"short title\" -- <command>` or `token-saver -- <command>` so short output prints normally and long output becomes ref + failure-focused snippet + exit code. Use this by default for tests, builds, logs, broad search, and git diff/show/log. Use `token-saver toon <json-file>` internally for agent-facing structured JSON when shorter. Do not transform command-required JSON, source files, code patches, raw secrets, tokens, cookies, auth headers, or exact API inputs. If args are provided, treat them as the specific token-saving task or mode to apply."
